<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fa" />
    <meta name="description" content="Your campus, one corner at a time. Welcome to Copilot Tower Defense." />
    <title>Copilot — Tower Defense</title>
    <link rel="icon" href="data:," />
    <script>
      (() => {
        let preference = 'light';
        try {
          const saved = localStorage.getItem('tower.ui.appearance.v1');
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved;
        } catch { /* The default remains usable when storage is blocked. */ }
        const theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0d1117' : '#f6f8fa');
      })();
    </script>
    <style>
      :root[data-theme='dark']{--ui-bg:#0d1117;--ui-fg:#f0f6fc;--ui-muted:#b1bac4;--ui-border:#3d444d;--ui-primary:#238636}
      body{margin:0;background:var(--ui-bg,#f6f8fa);color:var(--ui-fg,#1f2328);font-family:'Segoe UI',system-ui,sans-serif}
      #initial-startup{min-height:100vh;box-sizing:border-box;padding:10vw;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
      #initial-startup strong{letter-spacing:.18em;font-size:28px}#initial-startup p{line-height:1.6;max-width:44ch;color:var(--ui-muted,#59636e)}
      #initial-startup button{padding:12px 20px;min-height:44px;border:1px solid var(--ui-border,#d1d9e0);border-radius:6px;background:var(--ui-primary,#1f883d);color:#fff;font:inherit;cursor:pointer}
      #initial-startup [hidden]{display:none}noscript{display:block;padding:24px}
    </style>
  </head>
  <body>
    <div id="root"><div id="initial-startup"><strong>COPILOT</strong><p role="status">Opening your campus…</p><div id="startup-recovery" hidden><p>The app hasn’t finished opening. Check your connection and try again.</p><button id="startup-reload">Reload app</button></div></div></div>
    <noscript>Enable JavaScript to open Copilot Tower Defense.</noscript>
    <script>
      (() => {
        const showRecovery = () => { const help = document.getElementById('startup-recovery'); if (help) help.hidden = false; };
        const timeout = setTimeout(showRecovery, 20000);
        const failed = event => { if (event.target instanceof HTMLScriptElement) showRecovery(); };
        window.addEventListener('error', failed, true);
        document.getElementById('startup-reload').addEventListener('click', () => location.reload());
        window.addEventListener('tower:mounted', () => { clearTimeout(timeout); window.removeEventListener('error', failed, true); }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
