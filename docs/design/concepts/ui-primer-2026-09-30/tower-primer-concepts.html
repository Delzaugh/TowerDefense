#tower-primer-concepts{color-scheme:dark;font-family:TowerMona,'Segoe UI',system-ui,sans-serif;--tp-bg:#0d1117;--tp-panel:#151b23;--tp-raised:#212830;--tp-border:#3d444d;--tp-ink:#f0f6fc;--tp-muted:#b1bac4;--tp-accent:#58a6ff;--tp-ready:#238636;--tp-warning:#d29922;--tp-danger:#f85149;--tp-radius:8px;color:var(--tp-ink);font-size:14px;line-height:1.5}
#tower-primer-concepts *{box-sizing:border-box}
#tower-primer-concepts [hidden]{display:none!important}
#tower-primer-concepts button{font:inherit;color:inherit}
#tower-primer-concepts .tp-concept{position:relative;width:100%;background:var(--tp-bg);border-radius:12px;overflow:hidden}
#tower-primer-concepts .tp-viewbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--tp-border);background:var(--tp-panel)}
#tower-primer-concepts .tp-concept-name{font-size:15px;font-weight:650;margin-right:10px}
#tower-primer-concepts .tp-preview-label{font-size:11px;color:var(--tp-muted)}
#tower-primer-concepts .tp-view-tabs{display:flex;gap:3px;padding:3px;background:var(--tp-bg);border-radius:7px}
#tower-primer-concepts .tp-view-tabs button{border:0;background:transparent;border-radius:5px;min-height:32px;padding:5px 11px;font-size:12px;color:var(--tp-muted)}
#tower-primer-concepts .tp-view-tabs button[aria-pressed=true]{background:var(--tp-raised);color:var(--tp-ink);box-shadow:0 1px 2px #0004}
#tower-primer-concepts .tp-stage{position:relative;min-height:560px;isolation:isolate;background:var(--tp-bg)}
#tower-primer-concepts .tp-scene{position:relative;min-height:560px;overflow:hidden}
#tower-primer-concepts .tp-background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;pointer-events:none;z-index:-2}
#tower-primer-concepts .tp-shade{position:absolute;inset:0;background:linear-gradient(180deg,#0d11175c,transparent 24%,transparent 68%,#0d111770);z-index:-1;pointer-events:none}
#tower-primer-concepts .tp-hub .tp-background{object-fit:cover;object-position:50% 44%}
#tower-primer-concepts .tp-panel{background:var(--tp-panel);border:1px solid var(--tp-border);border-radius:var(--tp-radius);box-shadow:0 4px 12px #0003}
#tower-primer-concepts .tp-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 14px;border:1px solid var(--tp-border);border-radius:calc(var(--tp-radius) - 2px);background:var(--tp-raised);font-size:13px;font-weight:600;box-shadow:0 2px 0 #0004;transition:background 120ms,border-color 120ms,transform 120ms}
#tower-primer-concepts .tp-button:hover,#tower-primer-concepts .tp-force-hover{background:color-mix(in srgb,var(--tp-raised),var(--tp-ink) 9%);border-color:var(--tp-muted);transform:translateY(-1px)}
#tower-primer-concepts .tp-button:active,#tower-primer-concepts .tp-force-pressed{transform:translateY(1px);box-shadow:none;background:var(--tp-bg)}
#tower-primer-concepts .tp-button.tp-primary{background:var(--tp-ready);border-color:color-mix(in srgb,var(--tp-ready),#fff 25%);color:#fff}
#tower-primer-concepts .tp-primary:hover{background:color-mix(in srgb,var(--tp-ready),#fff 8%)}
#tower-primer-concepts .tp-button.tp-quiet{background:var(--tp-panel);box-shadow:none}
#tower-primer-concepts .tp-danger-action{color:var(--tp-danger);background:transparent}
#tower-primer-concepts button:focus-visible,#tower-primer-concepts input:focus-visible{outline:2px solid var(--tp-accent);outline-offset:3px}
#tower-primer-concepts .tp-force-focus{outline:2px solid var(--tp-accent);outline-offset:3px}
#tower-primer-concepts .tp-button[aria-disabled=true]{color:var(--tp-muted);box-shadow:none;background:var(--tp-panel);transform:none}
#tower-primer-concepts .tp-icon-button{width:42px;min-width:42px;padding:0}
#tower-primer-concepts svg[data-lucide],#tower-primer-concepts .lucide{width:17px;height:17px;flex:none;stroke-width:1.7}
#tower-primer-concepts kbd{font:500 11px TowerMona,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:20px;padding:0 4px;border:1px solid #ffffff38;border-radius:4px;color:inherit;background:#0002}
#tower-primer-concepts .tp-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--tp-muted);font-weight:600}
#tower-primer-concepts .tp-num{font-variant-numeric:tabular-nums;font-weight:650}
#tower-primer-concepts .tp-muted{color:var(--tp-muted)}
#tower-primer-concepts .tp-status{display:flex;align-items:center;gap:7px;font-size:12px}
#tower-primer-concepts .tp-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 7px;border-radius:5px;color:var(--tp-muted);background:var(--tp-raised);white-space:nowrap}
#tower-primer-concepts .tp-tag.tp-blue{background:color-mix(in srgb,var(--tp-accent) 15%,var(--tp-panel));color:var(--tp-accent)}
#tower-primer-concepts .tp-tag.tp-gold{background:#d2992220;color:#eac66f}
#tower-primer-concepts .tp-tag.tp-red{background:#f8514920;color:#ffaaa5}
#tower-primer-concepts .tp-meter{height:6px;border-radius:3px;overflow:hidden;background:var(--tp-raised);margin-top:8px}
#tower-primer-concepts .tp-meter span{display:block;height:100%;background:#3fb950;border-radius:3px;width:var(--tp-fill,80%)}
#tower-primer-concepts .tp-meter.tp-critical span{background:var(--tp-danger)}
#tower-primer-concepts .tp-health{position:absolute;left:18px;top:18px;width:194px;padding:12px 14px}
#tower-primer-concepts .tp-health-label{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px}
#tower-primer-concepts .tp-health-label>span{display:flex;align-items:center;gap:7px}
#tower-primer-concepts .tp-wave{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;gap:13px;align-items:center;padding:11px 14px;white-space:nowrap}
#tower-primer-concepts .tp-wave strong{font-size:15px;font-weight:650}
#tower-primer-concepts .tp-resources{position:absolute;right:18px;top:18px;display:flex;gap:7px;align-items:center}
#tower-primer-concepts .tp-resource-cluster{display:flex;gap:15px;align-items:center;padding:11px 13px}
#tower-primer-concepts .tp-resource{display:flex;align-items:center;gap:6px;font-size:12px}
#tower-primer-concepts .tp-resource .tp-num{font-size:15px;min-width:25px}
#tower-primer-concepts .tp-resource .tp-label{font-size:10px;color:var(--tp-muted)}
#tower-primer-concepts .tp-resource.tp-debt svg{color:#eac66f}
#tower-primer-concepts .tp-dock{position:absolute;left:18px;bottom:18px;display:flex;gap:5px;padding:6px}
#tower-primer-concepts .tp-unit{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;width:87px;min-height:99px;padding:9px 5px 6px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--tp-ink);transition:background 120ms,border-color 120ms}
#tower-primer-concepts .tp-unit:hover{background:var(--tp-raised)}
#tower-primer-concepts .tp-unit[aria-pressed=true]{background:color-mix(in srgb,var(--tp-accent) 15%,var(--tp-panel));border-color:var(--tp-accent)}
#tower-primer-concepts .tp-unit[aria-disabled=true]{color:var(--tp-muted)}
#tower-primer-concepts .tp-unit img{width:47px;height:43px;object-fit:contain;margin-bottom:4px;filter:drop-shadow(0 3px 4px #0004)}
#tower-primer-concepts .tp-unit .tp-placeholder{width:47px;height:43px;display:grid;place-items:center;color:var(--tp-muted);margin-bottom:4px}
#tower-primer-concepts .tp-unit .tp-placeholder .lucide{width:27px;height:27px}
#tower-primer-concepts .tp-unit .tp-unit-label{font-weight:600;font-size:11px}
#tower-primer-concepts .tp-unit .tp-unit-meta{font-size:10px;color:var(--tp-muted)}
#tower-primer-concepts .tp-unit kbd{position:absolute;left:5px;top:4px;font-size:9px;height:16px;min-width:15px;padding:0 2px}
#tower-primer-concepts .tp-inspector{position:absolute;right:18px;bottom:88px;width:232px;padding:14px}
#tower-primer-concepts .tp-inspector-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px}
#tower-primer-concepts .tp-selected-title{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:650}
#tower-primer-concepts .tp-selected-title img{width:37px;height:37px;object-fit:contain}
#tower-primer-concepts .tp-subtext{font-size:11px;color:var(--tp-muted);margin:8px 0 12px}
#tower-primer-concepts .tp-segments{display:flex;gap:3px;padding:3px;border-radius:6px;background:var(--tp-bg);margin-top:6px}
#tower-primer-concepts .tp-segments button{flex:1;padding:6px 8px;min-height:34px;font-size:11px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--tp-muted)}
#tower-primer-concepts .tp-segments button[aria-pressed=true]{border-color:var(--tp-border);background:var(--tp-raised);color:var(--tp-ink);box-shadow:0 1px 2px #0004}
#tower-primer-concepts .tp-inline-stat{display:flex;justify-content:space-between;gap:10px;font-size:11px;margin:12px 0;color:var(--tp-muted)}
#tower-primer-concepts .tp-next{position:absolute;right:18px;bottom:18px;display:flex;align-items:center;gap:10px}
#tower-primer-concepts .tp-next-preview{padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:11px}
#tower-primer-concepts .tp-target{position:absolute;left:42%;top:52%;width:50px;height:50px;border:2px solid var(--tp-accent);border-radius:50%;background:#58a6ff15;box-shadow:0 0 0 5px #58a6ff20;display:grid;place-items:center}
#tower-primer-concepts .tp-target img{width:40px;height:40px;object-fit:contain;transform:translateY(-5px)}
#tower-primer-concepts .tp-small-badge{position:absolute;top:-21px;padding:2px 7px;border-radius:4px;background:var(--tp-panel);border:1px solid var(--tp-border);font-size:10px;white-space:nowrap}
#tower-primer-concepts .tp-feedback{position:absolute;left:50%;top:85px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 13px;background:var(--tp-panel);border:1px solid var(--tp-border);border-radius:6px;font-size:12px;white-space:nowrap;box-shadow:0 3px 10px #0003}
#tower-primer-concepts .tp-feedback svg{color:var(--tp-accent)}
#tower-primer-concepts .tp-feedback.tp-alert{border-left:3px solid var(--tp-danger)}
#tower-primer-concepts .tp-feedback.tp-alert svg{color:var(--tp-danger)}
#tower-primer-concepts .tp-scene-caption{display:none}
#tower-primer-concepts .tp-rail{position:absolute;left:18px;top:109px;padding:5px;display:flex;flex-direction:column;gap:4px}
#tower-primer-concepts .tp-command .tp-unit{width:77px;min-height:82px}
#tower-primer-concepts .tp-command .tp-unit img{height:35px;width:40px}

  const saved = window.openai?.widgetState?.privateContent?.concepts || {};
  const states = {};
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button = (label, action, opts = '') => {
    const iconOnly=!label.replace(/<[^>]*>/g,'').trim();
    const names={pause:'Pause game',settings:'Settings',sound:'Interface sound settings','zoom-out':'Zoom out','zoom-in':'Zoom in'};
    return `<button type="button" class="tp-button cursor-interaction ${opts}" data-action="${action}" ${iconOnly?`aria-label="${names[action]||action}"`:''}>${label}</button>`;
  };
  const portrait = who => who === 'Developer' ? `<img src="${media.developer}" alt="">` : who === 'Copilot' ? `<img src="${media.base}" alt="">` : `<span class="tp-placeholder">${icon(who === 'Tester' ? 'shield-check' : 'lock-keyhole')}</span>`;
  function save() {
    const concepts = {};
    for (const [id,s] of Object.entries(states)) concepts[id] = { view:s.view,mode:s.mode,selected:s.selected,phase:s.phase,health:s.health,compute:s.compute,overlay:s.overlay };
    const visible = [...root.querySelectorAll('[data-variant]')].find(v => !v.hidden);
    const selectedId = visible?.querySelector('[data-concept]')?.dataset.concept;
    if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent:{concept:visible?.dataset.variant, screen:states[selectedId]?.view,operatingMode:states[selectedId]?.mode},privateContent:{concepts} }).catch(()=>{});
  }
  function meter(s,compact=false) {
    return `<div class="${compact?'tp-ribbon-health':'tp-health tp-panel'}"><div class="tp-health-label"><span>${icon('heart')} Product</span><b class="tp-num">${s.health} / 100</b></div><div class="tp-meter ${s.health<30?'tp-critical':''}" role="meter" aria-label="Product health" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${s.health}"><span style="--tp-fill:${s.health}%"></span></div></div>`;
  }
  function resources(s) {
    return `<div class="tp-resource-cluster tp-panel"><span class="tp-resource">${icon('cpu')}<b class="tp-num">${s.compute}</b><span class="tp-label">Compute</span></span><span class="tp-resource tp-debt">${icon('triangle-alert')}<b class="tp-num">3</b><span class="tp-label">Debt</span></span></div>`;
  }
  function wave(s,inline=false) {
    const label=s.phase==='active'?'In progress':'Planning';
    return `<div class="${inline?'tp-wave-inline':'tp-wave tp-panel'}"><strong>Wave <span class="tp-num">4 / 8</span></strong>${inline?'<div class="tp-wave-track" aria-label="Three waves completed, wave four next">'+Array.from({length:8},(_,i)=>`<span class="${i<3?'tp-done':i===3?'tp-current':''}"></span>`).join('')+'</div>':'<span class="tp-tag tp-blue">'+icon(s.phase==='active'?'activity':'construction')+label+'</span>'}</div>`;
  }
  function units(s,rail=false) {
    return `<div class="${rail?'tp-rail':'tp-dock'} tp-panel" role="group" aria-label="Build and select Copilots">${['Copilot','Developer','Tester','Analyst'].map((name,i)=>`<button type="button" class="tp-unit cursor-interaction" data-unit="${name}" aria-label="${name==='Copilot'?'Place a base Copilot for 30 Compute':name==='Analyst'?'Analyst, locked until Level 1 is complete':'Select '+name}" aria-pressed="${s.selected===name}" ${name==='Analyst'?'aria-disabled="true"':''}><kbd>${i+1}</kbd>${portrait(name)}<span class="tp-unit-label">${name}</span><span class="tp-unit-meta">${name==='Copilot'?'30 Compute':name==='Analyst'?'Locked':'Select tower'}</span></button>`).join('')}</div>`;
  }
  function inspector(s) {
    const selected=s.selected==='Copilot'?'Copilot':s.selected;
    return `<div class="tp-inspector tp-panel" aria-label="Selected ${selected} controls"><div class="tp-inspector-head"><span class="tp-selected-title">${portrait(selected)}<span>${selected}<small class="tp-kicker" style="display:block;margin-top:2px">${selected==='Copilot'?'Placement':'Tower 02'}</small></span></span><span class="tp-tag tp-blue">Selected</span></div><div class="tp-kicker">Operating mode</div><div class="tp-segments" role="group" aria-label="Operating mode">${['Build','Defend','Auto'].map(mode=>`<button type="button" class="cursor-interaction" data-mode="${mode}" aria-pressed="${s.mode===mode}">${mode}</button>`).join('')}</div><div class="tp-subtext" aria-live="polite">${{Build:'Completes Work and debt cleanup.',Defend:'Resolves Problems.',Auto:'Problems first, then Work and cleanup.'}[s.mode]}</div><div class="tp-inline-stat"><span>Target priority</span><span>Closest to Product</span></div>${button(icon('arrow-up')+' Upgrade <span class="tp-num">20</span>','upgrade','tp-quiet')}${selected==='Copilot'?button(icon('x')+' Cancel','cancel-place','tp-quiet'):''}</div>`;
  }
  function next(s,command=false) {
    const preview=`<div class="tp-next-preview tp-panel">${icon('bug')}<span>Next: Bugs + Missing Details</span></div>`;
    return `<div class="tp-next ${command?'tp-panel':''}">${command?'<div><span class="tp-kicker">Wave 4 · Incoming</span>'+preview+'</div>':preview}${button(icon(s.phase==='active'?'pause':'play')+(s.phase==='active'?' Pause wave':' Start wave')+' <kbd>Space</kbd>',s.phase==='active'?'pause':'start','tp-primary')}</div>`;
  }
  function battlefield(id,s) {
    const command=id==='command';
    const header=command?`<div class="tp-ribbon tp-panel">${meter(s,true)}${wave(s,true)}${resources(s)}${button(icon('pause'),'pause','tp-icon-button')}</div>`:`${id==='spatial'?'':meter(s)}${wave(s)}<div class="tp-resources">${resources(s)}${button(icon('pause'),'pause','tp-icon-button')}</div>${id==='spatial'?meter(s):''}`;
    return `<div class="tp-scene"><img class="tp-background" src="${media.battlefield}" alt="Existing Garden Switchback 3D map used as the concept backdrop"><div class="tp-shade"></div>${header}<button type="button" class="tp-target cursor-interaction" data-unit="Developer" aria-label="Inspect Developer tower on the map">${portrait('Developer')}<span class="tp-small-badge">Developer 02</span></button>${s.notice?`<div class="tp-feedback ${s.health<30?'tp-alert':''}" role="status">${icon(s.health<30?'triangle-alert':s.phase==='active'?'activity':'info')}${s.notice}</div>`:''}${units(s,command)}${s.selected?inspector(s):''}${next(s,command)}<div class="tp-scene-caption">Existing 3D map · HUD concept</div></div>`;
  }
  function hub(id,s) {

    const pins=id==='spatial'?`<button type="button" class="tp-world-pin cursor-interaction" style="left:43%;top:39%" data-action="copilots">${icon('bot')} Copilot lab <kbd>1</kbd></button><button type="button" class="tp-world-pin cursor-interaction" style="left:61%;top:58%" data-action="product">${icon('box')} Product <kbd>2</kbd></button>`:'';
    return `<div class="tp-scene tp-hub"><img class="tp-background" src="${media.campus}" alt="Current Tower campus used as the hub concept backdrop"><div class="tp-shade"></div><div class="tp-brand">COPILOT<small>TOWER DEFENSE</small></div><span class="tp-hub-note">Copilot hub</span><div class="tp-hub-controls">${button(icon('volume-2'),'sound','tp-icon-button tp-quiet')}${button(icon('settings-2'),'settings','tp-icon-button tp-quiet')}</div>${pins}<div class="tp-mission tp-panel"><span class="tp-kicker">Level 1 · Saved between waves</span><h2>Just one<br>small feature.</h2><span class="tp-status">${icon('flag')} Wave 4 · Planning</span>${button(icon('play')+' Continue <kbd>Enter</kbd>','continue','tp-primary')}</div><div class="tp-hub-menu" role="group" aria-label="Campus destinations">${menu}</div>${id!=='spatial'?'<div class="tp-zoom-tools">'+button(icon('minus'),'zoom-out','tp-icon-button tp-quiet')+button('100%','zoom-reset','tp-quiet')+button(icon('plus'),'zoom-in','tp-icon-button tp-quiet')+'</div>':''}</div>`;
  }
  function elements(s) {
    return `<div class="tp-elements"><h3>Action hierarchy</h3><div class="tp-element-row">${button(icon('play')+' Start wave <kbd>Space</kbd>','start','tp-primary')}${button(icon('arrow-up')+' Upgrade · 20','upgrade')}${button(icon('rotate-ccw')+' Restart','restart','tp-danger-action')}${button(icon('settings-2'),'settings','tp-icon-button tp-quiet')}</div><h3>Button feedback</h3><div class="tp-element-row">${[['Rest',''],['Hover','tp-force-hover'],['Pressed','tp-force-pressed'],['Focus','tp-force-focus']].map(([label,cls])=>`<div class="tp-state-sample">${button('Upgrade','upgrade',cls)}<span>${label}</span></div>`).join('')}<div class="tp-state-sample"><button type="button" class="tp-button cursor-interaction" data-action="locked" aria-disabled="true">${icon('lock-keyhole')} Analyst</button><span>Unavailable · reason on activation</span></div></div><div class="tp-elements-grid"><div><h3>Selection + mode</h3>${inspector(s)}<div class="tp-swatches"><span class="tp-swatch"><i style="--swatch:var(--tp-accent)"></i>Selection</span><span class="tp-swatch"><i style="--swatch:#238636"></i>Ready</span><span class="tp-swatch"><i style="--swatch:#d29922"></i>Attention</span><span class="tp-swatch"><i style="--swatch:#f85149"></i>Danger</span></div></div><div><h3>Game feedback</h3><div class="tp-message tp-warning">${icon('triangle-alert')}<span>3 Technical Debt<br><span class="tp-muted">Unfinished Work adds debt.</span></span></div><div class="tp-message tp-error">${icon('octagon-x')}<span>Path blocked<br><span class="tp-muted">Place the Copilot in a clearing.</span></span></div><div class="tp-message">${icon('check')}<span>Work completed<br><span class="tp-muted">+12 Compute · Product healed</span></span></div><div class="tp-element-row">${button('Pause','pause','tp-quiet')}${button('Victory','victory','tp-quiet')}${button('Defeat','defeat','tp-quiet')}</div></div></div></div>`;
  }
  function overlay(s) {
    if(!s.overlay)return '';
    let content='';
    if(s.overlay==='pause')content=`<span class="tp-kicker">Wave 4 · Paused</span><h2>Take a breather.</h2><p>Your Product and Copilots are waiting.</p><div class="tp-dialog-buttons">${button(icon('play')+' Resume <kbd>Esc</kbd>','resume','tp-primary')}${button(icon('settings-2')+' Settings','settings')}${button('Back to hub','hub','tp-quiet')}</div>`;
    if(s.overlay==='settings')content=`<span class="tp-kicker">Comfort + feedback</span><h2>Settings</h2><label class="tp-dialog-row"><span>Interface sounds</span><input type="checkbox" data-setting="sounds" ${s.sounds?'checked':''}></label><label class="tp-dialog-row"><span>Reduced motion</span><input type="checkbox" data-setting="motion" ${s.reduced?'checked':''}></label><label class="tp-dialog-row"><span>Clearer status contrast</span><input type="checkbox" data-setting="contrast" ${s.contrast?'checked':''}></label><div class="tp-dialog-buttons" style="margin-top:18px">${button('Done','close','tp-primary')}</div>`;
    if(s.overlay==='victory')content=`<div class="tp-result-icon">${icon('flag')}</div><span class="tp-kicker" style="display:block;margin-top:14px">Level complete</span><h2>Ready for the<br>next big idea.</h2><p>Production Incident resolved.<br>Analyst unlocked for your next run.</p><div class="tp-dialog-buttons">${button(icon('bot')+' Meet the Analyst','locked','tp-primary')}${button('Return to campus','hub','tp-quiet')}</div>`;
    if(s.overlay==='defeat'||s.overlay==='restart')content=`<div class="tp-result-icon">${icon('heart-crack')}</div><span class="tp-kicker" style="display:block;margin-top:14px">${s.overlay==='restart'?'Restart level':'Product offline'}</span><h2>${s.overlay==='restart'?'A fresh start?':'A small setback.'}</h2><p>${s.overlay==='restart'?'Start again from wave 1. This attempt’s progress will reset.':'The Product ran out of health.<br>Try another layout and give Work room to finish.'}</p><div class="tp-dialog-buttons">${button(icon('rotate-ccw')+' '+(s.overlay==='restart'?'Restart level':'Retry level'),'retry','tp-primary')}${button(s.overlay==='restart'?'Keep playing':'Back to hub',s.overlay==='restart'?'close':'hub','tp-quiet')}</div>`;
    if(s.overlay==='locked')content=`${portrait('Copilot')}<span class="tp-kicker" style="display:block;margin-top:14px">${s.analystUnlocked?'Persona unlocked':'Persona unlock'}</span><h2>Analyst</h2><p>${s.analystUnlocked?'The Analyst is ready for your next run. A passive Persona that supports your team.':'Finish Level 1 to add the Analyst to your team.'}</p><div class="tp-dialog-buttons">${button('Back','close','tp-primary')}</div>`;
    if(s.overlay==='copilots')content=`<span class="tp-kicker">Copilot lab</span><h2>Your team, ready.</h2><div class="tp-element-row">${portrait('Copilot')}${portrait('Developer')}</div><p>Place a Base Copilot, then specialize during the level. Developer and Tester are available in Level 1.</p><div class="tp-dialog-buttons">${button('Enter planning','continue','tp-primary')}${button('Back to campus','close','tp-quiet')}</div>`;
    if(s.overlay==='product')content=`<span class="tp-kicker">Your Product</span><h2>Something worth<br>protecting.</h2><p>Completed Work grows your Product after successful levels. Growth is a visual reward.</p><div class="tp-dialog-buttons">${button('Back to campus','close','tp-primary')}</div>`;
    if(s.overlay==='levels')content=`<span class="tp-kicker">Level select</span><h2>Just one<br>small feature.</h2><p>Level 1 · Continue from wave 4.<br>More levels will follow.</p><div class="tp-dialog-buttons">${button(icon('play')+' Continue','continue','tp-primary')}${button('Back to campus','close','tp-quiet')}</div>`;
    return `<div class="tp-backdrop"><div class="tp-dialog tp-panel ${s.overlay==='defeat'||s.overlay==='restart'?'tp-failure':''}" role="dialog" aria-modal="true" aria-label="${s.overlay}">${content}</div></div>`;
  }
  function render(el,s,moveFocus=false) {
    const id=el.dataset.concept;
    const stage=el.querySelector('.tp-stage');
    stage.innerHTML=`<div ${s.overlay?'inert':''}>${s.view==='hub'?hub(id,s):s.view==='elements'?elements(s):battlefield(id,s)}</div>${overlay(s)}`;
    el.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===s.view)));
    el.style.setProperty('--tp-radius',s.radius+'px');
    el.style.setProperty('--tp-accent',s.accent);
    if(s.contrast)el.style.setProperty('--tp-border','#a0b5c7');else el.style.removeProperty('--tp-border');
    if(globalThis.lucide) lucide.createIcons({attrs:{width:16,height:16}});
    if(moveFocus) queueMicrotask(()=>stage.querySelector(s.overlay?'.tp-dialog button':'button')?.focus({preventScroll:true}));
  }
  function action(el,s,name) {
    if(name==='start'){s.view='battlefield';s.overlay=null;s.phase='active';s.notice='Wave 4 incoming · Bugs + Missing Details';}
    if(name==='pause')s.overlay='pause';
    if(name==='resume'){s.overlay=null;s.notice=s.phase==='active'?'Wave resumed':null;}
    if(name==='settings'){s.backOverlay=s.overlay==='pause'?'pause':null;s.overlay='settings';}
    if(name==='close'){s.overlay=s.backOverlay||null;s.backOverlay=null;}
    if(name==='hub'){s.view='hub';s.overlay=null;}
    if(name==='continue'){s.view='battlefield';s.phase='planning';s.overlay=null;s.notice=null;}
    if(name==='upgrade'){if(s.compute>=20){s.compute-=20;s.notice='Upgrade ready · −20 Compute';}else s.notice='Need 20 Compute to upgrade';}
    if(name==='cancel-place'){s.selected='Developer';s.notice=null;}
    if(['locked','copilots','product','levels','victory','defeat','restart'].includes(name))s.overlay=name;
    if(name==='victory')s.analystUnlocked=true;
    if(name==='retry'){s.phase='planning';s.health=100;s.compute=100;s.view='battlefield';s.overlay=null;s.notice='New attempt · Planning';}
    if(name==='sound'){s.sounds=!s.sounds;s.overlay='settings';}
    if(name.startsWith('zoom-')){s.zoom=name==='zoom-reset'?100:Math.max(70,Math.min(130,(s.zoom||100)+(name==='zoom-in'?10:-10)));el.querySelector('.tp-hub .tp-background')?.style.setProperty('scale',s.zoom/100);const b=el.querySelector('[data-action="zoom-reset"]');if(b)b.textContent=s.zoom+'%';save();return;}
    render(el,s,true);save();
  }
  root.querySelectorAll('[data-concept]').forEach(el=>{
    const id=el.dataset.concept;
    const s=states[id]={view:'battlefield',selected:'Developer',mode:'Auto',phase:'planning',health:80,compute:125,overlay:null,notice:null,analystUnlocked:false,sounds:true,reduced:false,contrast:false,radius:id==='spatial'?6:8,accent:id==='field'?'#58a6ff':'#82dadd',...saved[id]};
    if(!['battlefield','hub','elements'].includes(s.view))s.view='battlefield';
    if(!['Build','Defend','Auto'].includes(s.mode))s.mode='Auto';
    render(el,s);
    el.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b||!el.contains(b))return;
      if(b.dataset.view){s.view=b.dataset.view;s.overlay=null;render(el,s);save();return;}
      if(b.dataset.unit){if(b.dataset.unit==='Analyst'){s.overlay='locked';render(el,s,true);}else{s.selected=b.dataset.unit;s.notice=s.selected==='Copilot'?'Place Copilot · 30 Compute · Choose a clearing':null;render(el,s);el.querySelector(`[data-unit="${s.selected}"]`)?.focus({preventScroll:true});}save();return;}
      if(b.dataset.mode){s.mode=b.dataset.mode;render(el,s);el.querySelector(`[data-mode="${s.mode}"]`)?.focus({preventScroll:true});save();return;}
      if(b.dataset.action)action(el,s,b.dataset.action);
    });
    el.addEventListener('change',e=>{
      if(e.target.dataset.setting){const setting=e.target.dataset.setting;s[{sounds:'sounds',motion:'reduced',contrast:'contrast'}[setting]]=e.target.checked;render(el,s);el.querySelector(`[data-setting="${setting}"]`)?.focus({preventScroll:true});save();}
    });
    el.addEventListener('keydown',e=>{
      if(e.key==='Tab'&&s.overlay){const buttons=[...el.querySelectorAll('.tp-dialog button,.tp-dialog input')];const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}return;}
      if(e.key==='Escape'&&s.overlay){e.preventDefault();action(el,s,s.overlay==='pause'?'resume':'close');}
    });
    if(globalThis.Tweak){const tweak=new Tweak({container:el,onChange:()=>render(el,s)});tweak.addSlider(s,'radius',{label:'Panel corners',min:4,max:12,unit:'px',reference:'--tp-radius'});tweak.addColorPicker(s,'accent',{label:'Selection accent',reference:'--tp-accent'});tweak.addSlider(s,'health',{label:'Product health',min:10,max:100,unit:'%',reference:'Product.health'});}
  });
  document.addEventListener('keydown',e=>{
    if(document.activeElement!==document.body&&document.activeElement!==document.documentElement)return;
    const el=[...root.querySelectorAll('[data-concept]')].find(el=>!el.closest('[data-variant]').hidden);
    if(!el)return;const s=states[el.dataset.concept];
    if(e.key==='Escape'&&s.overlay){e.preventDefault();action(el,s,s.overlay==='pause'?'resume':'close');return;}
    if(s.overlay)return;
    if(e.code==='Space'&&s.view==='battlefield'){e.preventDefault();action(el,s,s.phase==='active'?'pause':'start');}
    if(e.key==='Enter'&&s.view==='hub'){e.preventDefault();action(el,s,'continue');}
    if(s.view==='battlefield'&&/^[1-4]$/.test(e.key)){e.preventDefault();el.querySelectorAll('[data-unit]')[Number(e.key)]?.click();}
  });
  window.addEventListener('openai:set_globals',e=>{
    const savedStates=e.detail?.globals?.widgetState?.privateContent?.concepts;
    if(savedStates)root.querySelectorAll('[data-concept]').forEach(el=>{const incoming=savedStates[el.dataset.concept];if(incoming){Object.assign(states[el.dataset.concept],incoming);render(el,states[el.dataset.concept]);}});
  });
})();
</script>
