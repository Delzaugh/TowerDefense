<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fa" />
    <meta name="description" content="Your campus, one corner at a time. Welcome to Copilot Tower Defense." />
    <title>Copilot — Tower Defense</title>
    <link rel="icon" href="data:," />
    <script>
      (() => {
        let preference = 'light';
        try {
          const saved = localStorage.getItem('tower.ui.appearance.v1');
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved;
        } catch { /* The default remains usable when storage is blocked. */ }
        const theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0d1117' : '#f6f8fa');
      })();
    </script>
    <style>:root[data-theme=dark]{--ui-bg:#0d1117;--ui-fg:#f0f6fc;--ui-muted:#b1bac4;--ui-border:#3d444d;--ui-primary:#238636}body{background:var(--ui-bg,#f6f8fa);color:var(--ui-fg,#1f2328);margin:0;font-family:Segoe UI,system-ui,sans-serif}#initial-startup{box-sizing:border-box;flex-direction:column;justify-content:center;align-items:flex-start;min-height:100vh;padding:10vw;display:flex}#initial-startup strong{letter-spacing:.18em;font-size:28px}#initial-startup p{max-width:44ch;color:var(--ui-muted,#59636e);line-height:1.6}#initial-startup button{border:1px solid var(--ui-border,#d1d9e0);background:var(--ui-primary,#1f883d);color:#fff;min-height:44px;font:inherit;cursor:pointer;border-radius:6px;padding:12px 20px}#initial-startup [hidden]{display:none}noscript{padding:24px;display:block}</style>
    <script type="module" crossorigin src="/TowerDefense/assets/index-Csp08ez5.js"></script>
    <link rel="modulepreload" crossorigin href="/TowerDefense/assets/rolldown-runtime-hePW80VL.js">
    <link rel="stylesheet" crossorigin href="/TowerDefense/assets/index-Mhd74BrM.css">
  </head>
  <body>
    <div id="root"><div id="initial-startup"><strong>COPILOT</strong><p role="status">Opening your campus…</p><div id="startup-recovery" hidden><p>The app hasn’t finished opening. Check your connection and try again.</p><button id="startup-reload">Reload app</button></div></div></div>
    <noscript>Enable JavaScript to open Copilot Tower Defense.</noscript>
    <script>
      (() => {
        const showRecovery = () => { const help = document.getElementById('startup-recovery'); if (help) help.hidden = false; };
        const timeout = setTimeout(showRecovery, 20000);
        const failed = event => { if (event.target instanceof HTMLScriptElement) showRecovery(); };
        window.addEventListener('error', failed, true);
        document.getElementById('startup-reload').addEventListener('click', () => location.reload());
        window.addEventListener('tower:mounted', () => { clearTimeout(timeout); window.removeEventListener('error', failed, true); }, { once: true });
      })();
    </script>
  </body>
</html>
