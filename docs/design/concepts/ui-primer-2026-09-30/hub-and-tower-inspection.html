#tower-hub-lab{font-family:HubMona,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5;color:#f0f6fc;color-scheme:dark;--hl-bg:#0d1117;--hl-panel:#151b23;--hl-raised:#212830;--hl-edge:#3d444d;--hl-muted:#b1bac4;--hl-accent:#58a6ff;--hl-radius:8px}
#tower-hub-lab *{box-sizing:border-box}
#tower-hub-lab [hidden]{display:none!important}
#tower-hub-lab button,#tower-hub-lab input{font:inherit}
#tower-hub-lab .hl-previewbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:11px 18px;background:var(--hl-panel);border-bottom:1px solid var(--hl-edge);border-radius:10px 10px 0 0}
#tower-hub-lab .hl-previewname{font-size:13px;font-weight:650}
#tower-hub-lab .hl-conceptlabel{color:var(--hl-muted);font-size:10px;margin-left:9px}
#tower-hub-lab .hl-screenpicker{display:flex;gap:3px;padding:3px;border-radius:6px;background:var(--hl-bg)}
#tower-hub-lab .hl-screenpicker button{border:0;min-height:32px;padding:5px 11px;border-radius:4px;background:transparent;color:var(--hl-muted);font-size:12px}
#tower-hub-lab .hl-screenpicker button[aria-pressed=true]{background:var(--hl-raised);color:#f0f6fc}
#tower-hub-lab .hl-screen{position:relative;isolation:isolate;overflow:hidden;border-radius:0 0 10px 10px;background:var(--hl-bg);min-height:660px}
#tower-hub-lab .hl-world{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 46%;z-index:-2;pointer-events:none}
#tower-hub-lab .hl-vignette{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#0d111760,transparent 22%,transparent 65%,#0d11177d),linear-gradient(90deg,#0d111740,transparent 24%,transparent 80%,#0d111740)}
#tower-hub-lab .hl-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 24px;min-height:80px;position:relative;z-index:2}
#tower-hub-lab .hl-wordmark{font-size:24px;line-height:1.05;font-weight:800;letter-spacing:.16em}
#tower-hub-lab .hl-wordmark small{display:block;margin-top:8px;font-size:8px;letter-spacing:.4em;color:#c4d5e4;font-weight:650}
#tower-hub-lab .hl-location{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--hl-muted)}
#tower-hub-lab .hl-header-actions{display:flex;gap:7px;align-items:center}
#tower-hub-lab .hl-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 13px;color:#f0f6fc;background:var(--hl-raised);border:1px solid var(--hl-edge);border-radius:calc(var(--hl-radius) - 2px);box-shadow:0 2px 0 #0004;font-size:12px;font-weight:600;transition:background 120ms,border-color 120ms,transform 120ms}
#tower-hub-lab .hl-button:hover{background:color-mix(in srgb,var(--hl-raised),#f0f6fc 8%);border-color:#8b949e;transform:translateY(-1px)}
#tower-hub-lab .hl-button:active{transform:translateY(1px);box-shadow:none}
#tower-hub-lab .hl-button.hl-primary{background:#238636;border-color:#3fb950;color:#fff}
#tower-hub-lab .hl-button.hl-primary:hover{background:#2a963e}
#tower-hub-lab .hl-button.hl-quiet{background:var(--hl-panel);box-shadow:none}
#tower-hub-lab .hl-icon-button{width:42px;min-width:42px;padding:0}
#tower-hub-lab button:focus-visible,#tower-hub-lab input:focus-visible,#tower-hub-lab summary:focus-visible{outline:2px solid var(--hl-accent);outline-offset:3px}
#tower-hub-lab .lucide{width:17px;height:17px;stroke-width:1.7;flex:none}
#tower-hub-lab .hl-kicker{text-transform:uppercase;letter-spacing:.12em;color:var(--hl-muted);font-size:10px;font-weight:600}
#tower-hub-lab kbd{display:inline-flex;align-items:center;justify-content:center;font:500 10px HubMona,system-ui,sans-serif;min-width:18px;height:19px;padding:0 4px;border:1px solid #ffffff38;border-radius:3px;background:#0002;color:inherit}
#tower-hub-lab .hl-panel{border:1px solid var(--hl-edge);border-radius:var(--hl-radius);background:var(--hl-panel);box-shadow:0 4px 14px #0003}
#tower-hub-lab .hl-mission{position:absolute;left:24px;bottom:25px;width:304px;padding:18px;border-top:2px solid var(--hl-accent)}
#tower-hub-lab .hl-mission h2{font-size:27px;line-height:1.12;font-weight:750;margin:10px 0 15px}
#tower-hub-lab .hl-save-status{display:flex;gap:7px;align-items:center;color:var(--hl-muted);font-size:11px}
#tower-hub-lab .hl-save-status .lucide{color:#3fb950;width:14px;height:14px}
#tower-hub-lab .hl-run-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 15px;font-size:12px}
#tower-hub-lab .hl-run-meta span{display:flex;align-items:center;gap:6px}
#tower-hub-lab .hl-numerals{font-variant-numeric:tabular-nums;font-weight:650}
#tower-hub-lab .hl-mission .hl-primary{width:100%;justify-content:space-between;margin:0 0 8px}
#tower-hub-lab .hl-small-link{display:inline-flex;align-items:center;gap:4px;background:transparent;border:0;color:var(--hl-muted);padding:5px 0;font-size:11px;text-align:left;min-height:26px}
#tower-hub-lab .hl-small-link:hover{color:#f0f6fc}
#tower-hub-lab .hl-destination-dock{position:absolute;bottom:25px;right:24px;display:flex;gap:7px}
#tower-hub-lab .hl-destination{min-width:89px;min-height:99px;display:flex;flex-direction:column;gap:8px;padding:11px 10px;font-size:11px;position:relative}
#tower-hub-lab .hl-destination img{height:37px;width:41px;object-fit:contain;filter:drop-shadow(0 3px 3px #0005)}
#tower-hub-lab .hl-destination .lucide{width:22px;height:22px;margin:6px 0 7px}
#tower-hub-lab .hl-destination kbd{position:absolute;top:6px;right:6px;font-size:9px;height:15px;min-width:15px;padding:0 2px}
#tower-hub-lab .hl-pin{position:absolute;left:48%;top:39%;display:flex;align-items:center;gap:7px;background:var(--hl-panel);border:1px solid var(--hl-edge);border-radius:5px;padding:8px 11px;font-size:11px;color:#f0f6fc;box-shadow:0 3px 10px #0004}
#tower-hub-lab .hl-pin:after{content:'';position:absolute;left:50%;top:100%;height:20px;width:1px;background:var(--hl-accent)}
#tower-hub-lab .hl-pin:hover{border-color:var(--hl-accent)}
#tower-hub-lab .hl-pin .hl-label-optional{color:var(--hl-muted);font-size:10px}
#tower-hub-lab .hl-camera-dock{position:absolute;bottom:33px;left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:4px;background:var(--hl-panel);border:1px solid var(--hl-edge);border-radius:7px}
#tower-hub-lab .hl-camera-dock .hl-button{min-height:33px;padding:4px 9px;box-shadow:none;border:0;background:transparent;font-size:11px}
#tower-hub-lab .hl-camera-dock .hl-button[aria-pressed=true]{background:var(--hl-raised);color:#f0f6fc}
#tower-hub-lab .hl-lab .hl-header{min-height:70px;padding:14px 22px;background:var(--hl-panel);border-bottom:1px solid var(--hl-edge)}
#tower-hub-lab .hl-lab-brand{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:650;color:var(--hl-muted)}
#tower-hub-lab .hl-lab-brand strong{color:#f0f6fc;font-weight:650}
#tower-hub-lab .hl-lab-workspace{display:grid;grid-template-columns:minmax(0,1fr) 282px;gap:18px;padding:18px 22px 0;min-height:461px}
#tower-hub-lab .hl-model-zone{position:relative;min-height:461px;isolation:isolate;overflow:hidden;border-radius:6px;background:#293a48}
#tower-hub-lab .hl-studio-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;z-index:-1;pointer-events:none}
#tower-hub-lab .hl-model-title{position:absolute;left:22px;top:19px;right:20px}
#tower-hub-lab .hl-model-title .hl-kicker{color:#bfd0dc}
#tower-hub-lab .hl-model-title h2{font-size:34px;line-height:1.05;letter-spacing:-.02em;font-weight:750;margin:6px 0 8px}
#tower-hub-lab .hl-role{font-size:12px;color:#d5e1eb;margin:0;max-width:32ch}
#tower-hub-lab .hl-availability{position:absolute;left:22px;bottom:73px;display:flex;gap:6px;align-items:center;color:#f0f6fc;font-size:10px;background:var(--hl-panel);padding:4px 8px;border-radius:4px;max-width:calc(100% - 44px)}
#tower-hub-lab .hl-availability .lucide{width:12px;height:12px;color:#3fb950}
#tower-hub-lab .hl-camera-views{position:absolute;bottom:18px;left:22px;right:22px;display:flex;gap:4px;justify-content:center}
#tower-hub-lab .hl-camera-views button{font-size:11px;min-height:33px;padding:5px 11px;background:var(--hl-panel);box-shadow:none}
#tower-hub-lab .hl-camera-views button[aria-pressed=true]{background:var(--hl-raised);border-color:var(--hl-accent)}
#tower-hub-lab .hl-capabilities{padding:16px 17px}
#tower-hub-lab .hl-capabilities h3{font-size:14px;margin:0 0 9px;font-weight:650}
#tower-hub-lab .hl-tower-description{font-size:11px;color:var(--hl-muted);margin:0 0 15px;line-height:1.6}
#tower-hub-lab .hl-stat{margin:13px 0}
#tower-hub-lab .hl-stat-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600}
#tower-hub-lab .hl-stat-label .lucide{color:var(--hl-muted);height:15px;width:15px}
#tower-hub-lab .hl-gauge{display:flex;gap:3px;margin:7px 0 4px}
#tower-hub-lab .hl-gauge i{display:block;height:5px;flex:1;border-radius:1px;background:var(--hl-raised)}
#tower-hub-lab .hl-gauge i.hl-filled{background:var(--hl-accent)}
#tower-hub-lab .hl-stat-compute .hl-gauge i.hl-filled{background:#82dadd}
#tower-hub-lab .hl-stat-caption{font-size:10px;color:var(--hl-muted)}
#tower-hub-lab .hl-modes{margin-top:15px;padding-top:12px;border-top:1px solid var(--hl-edge);display:flex;gap:6px;flex-wrap:wrap}
#tower-hub-lab .hl-modes span{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--hl-muted)}
#tower-hub-lab .hl-modes .lucide{width:13px;height:13px}
#tower-hub-lab .hl-ability{margin-top:12px;padding-top:11px;border-top:1px solid var(--hl-edge);font-size:11px;color:var(--hl-muted)}
#tower-hub-lab .hl-ability summary{display:flex;align-items:center;gap:7px;list-style:none;font-weight:650;color:#f0f6fc;min-height:30px}
#tower-hub-lab .hl-ability p{margin:8px 0;line-height:1.55}
#tower-hub-lab .hl-roster{padding:14px 22px 15px}
#tower-hub-lab .hl-roster-header{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--hl-muted);margin-bottom:7px}
#tower-hub-lab .hl-roster-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
#tower-hub-lab .hl-portrait{border:1px solid var(--hl-edge);border-radius:6px;min-height:85px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 4px;background:var(--hl-panel);color:#f0f6fc;position:relative}
#tower-hub-lab .hl-portrait:hover{background:var(--hl-raised);border-color:#8b949e}
#tower-hub-lab .hl-portrait[aria-pressed=true]{border-color:var(--hl-accent);background:color-mix(in srgb,var(--hl-accent) 14%,var(--hl-panel))}
#tower-hub-lab .hl-portrait img{height:38px;width:46px;object-fit:contain;filter:drop-shadow(0 3px 3px #0005)}
#tower-hub-lab .hl-portrait-name{font-size:10px;font-weight:600}
#tower-hub-lab .hl-portrait-note{font-size:9px;color:var(--hl-muted)}
#tower-hub-lab .hl-portrait-placeholder{height:38px;width:46px;display:grid;place-items:center;color:var(--hl-muted)}
#tower-hub-lab .hl-portrait-placeholder .lucide{width:23px;height:23px}
#tower-hub-lab .hl-check{position:absolute;right:5px;top:5px;color:var(--hl-accent);font-size:10px}
#tower-hub-lab .hl-check .lucide{width:12px;height:12px}
#tower-hub-lab .hl-preview-missing{position:absolute;left:25px;right:25px;top:43%;display:flex;flex-direction:column;align-items:center;text-align:center;color:#d0e0eb}
#tower-hub-lab .hl-preview-missing>svg,#tower-hub-lab .hl-preview-missing>i{width:42px;height:42px;display:block;margin:0 auto 12px;color:#8293a4}
#tower-hub-lab .hl-preview-missing strong{display:block;font-size:15px;font-weight:600}
#tower-hub-lab .hl-preview-missing p{font-size:11px;max-width:27ch;margin:8px auto 0;color:#bdcdd9}
#tower-hub-lab .hl-dialog-backdrop{position:absolute;inset:0;display:grid;place-items:center;z-index:10;background:#0d1117c9;padding:24px}
#tower-hub-lab .hl-dialog{width:100%;max-width:371px;padding:22px;box-shadow:0 12px 45px #0005}
#tower-hub-lab .hl-dialog h2{font-size:25px;line-height:1.12;margin:9px 0 13px;font-weight:750}
#tower-hub-lab .hl-dialog p{font-size:12px;color:var(--hl-muted);line-height:1.6;margin:10px 0 17px}
#tower-hub-lab .hl-dialog-actions{display:flex;flex-direction:column;gap:7px;margin-top:19px}
#tower-hub-lab .hl-dialog-actions .hl-button{width:100%}
#tower-hub-lab .hl-setting-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 0;font-size:12px;border-bottom:1px solid var(--hl-edge)}
#tower-hub-lab .hl-setting-row input{accent-color:var(--hl-accent);width:17px;height:17px}
#tower-hub-lab .hl-next-wave{display:flex;gap:8px;align-items:center;font-size:12px;margin:10px 0}
#tower-hub-lab .hl-notice{position:absolute;left:50%;top:97px;transform:translateX(-50%);padding:8px 11px;border:1px solid var(--hl-edge);border-radius:5px;background:var(--hl-panel);font-size:11px;z-index:5;max-width:calc(100% - 32px);text-align:center;box-shadow:0 3px 9px #0004}
#tower-hub-lab .hl-level{display:flex;align-items:center;gap:12px;border-top:1px solid var(--hl-edge);padding:12px 0;font-size:12px}
#tower-hub-lab .hl-level small{display:block;color:var(--hl-muted);font-size:10px;margin-top:4px}

 #tower-hub-lab .hl-availability{left:14px;bottom:64px;max-width:calc(100% - 28px);font-size:10px}

 function stats(t){
  const s=t.stats;
  const data=[];
  if(s.damage!==undefined)data.push(['damage','Damage','zap',s.damage,16,s.damage/16<1/3?'Light impact':s.damage/16<2/3?'Solid impact':'Powerful impact']);
  if(s.work!==undefined)data.push(['work','Work','code-2',s.work*60/s.cooldown,12.5,s.work*60/s.cooldown/12.5<1/3?'Measured throughput':s.work*60/s.cooldown/12.5<2/3?'Steady throughput':'Brisk throughput']);
  if(s.cooldown!==undefined)data.push(['speed','Action speed','gauge',60/s.cooldown,2.5,60/s.cooldown/2.5<1/3?'Measured actions':60/s.cooldown/2.5<2/3?'Steady actions':'Quick actions']);
  data.push(['range','Range','crosshair',s.range,8,s.range/8<1/3?'Close influence':s.range/8<2/3?'Balanced influence':'Broad influence']);
  data.push(['compute','Compute','cpu',s.investment,60,s.investment/60<1/3?'Modest investment':s.investment/60<2/3?'Considered investment':'Substantial investment']);
  return `<div class="hl-stat-grid">${data.map(([id,label,mark,value,max,caption])=>`<div class="hl-stat hl-stat-${id}"><div class="hl-stat-label">${icon(mark)}${label}</div><div class="hl-gauge" aria-hidden="true">${Array.from({length:8},(_,i)=>`<i class="${i<Math.round(value/max*8)?'hl-filled':''}"></i>`).join('')}</div><span class="hl-stat-caption">${caption}</span></div>`).join('')}</div>`;
 }

  const t=towers.find(t=>t.id===state.tower);
  const model=media.studios[t.id]?.[state.view];
  return `<div><header class="hl-header">${btn(icon('arrow-left')+' Back to Hub <kbd>Esc</kbd>','hub','hl-quiet')}<div class="hl-lab-brand">${icon('bot')}<strong>Copilot lab</strong><span> / Tower inspection</span></div>${btn(icon('settings-2'),'settings','hl-icon-button hl-quiet','Settings')}</header><div class="hl-lab-workspace"><section class="hl-model-zone" aria-label="${t.title} model preview">${model?`<img class="hl-studio-image" src="${model}" alt="${t.title}, ${state.view} view captured from the current game">`:''}<div class="hl-model-title" aria-live="polite"><span class="hl-kicker">${t.id==='base'?'Base Copilot':'Copilot Persona'}</span><h2>${t.title}</h2><p class="hl-role">${t.role}</p></div>${!model?`<div class="hl-preview-missing">${icon('box')}<strong>Model preview coming soon</strong><p>Role and capabilities are ready to explore.</p></div>`:''}<span class="hl-availability">${icon(t.id==='analyst'||t.id==='security'?'lock-keyhole':'info')}${t.available}</span>${model?`<div class="hl-camera-views" role="group" aria-label="Model view">${['left','front','right'].map(v=>`<button type="button" class="hl-button cursor-interaction" data-model-view="${v}" aria-pressed="${state.view===v}">${icon(v==='front'?'box':v==='left'?'rotate-ccw':'rotate-cw')}${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>`:''}</section><aside class="hl-capabilities hl-panel" aria-label="${t.title} capabilities"><h3>Capabilities</h3><p class="hl-tower-description">${t.description}</p>${stats(t)}${t.id==='base'||t.id==='developer'||t.id==='tester'||t.id==='security'?`<div class="hl-modes" aria-label="Available operating modes"><span>${icon('code-2')} Build</span><span>${icon('shield')} Defend</span><span>${icon('workflow')} Auto</span></div>`:''}${t.abilities.length?`<div class="hl-ability">${t.abilities.map(([name,desc])=>`<details><summary class="cursor-interaction">${icon('chevron-down')}${name}</summary><p>${desc}</p></details>`).join('')}</div>`:''}</aside></div><section class="hl-roster" aria-label="Tower collection"><div class="hl-roster-header"><span>PERSONAS</span><span>Choose a Tower</span></div><div class="hl-roster-grid" role="group" aria-label="Choose a Tower">${towers.map(t=>`<button type="button" class="hl-portrait cursor-interaction" data-tower="${t.id}" aria-pressed="${state.tower===t.id}" aria-label="${t.title}${!media.studios[t.id]?', model preview coming soon':''}">${portrait(t.id)}<span class="hl-portrait-name">${t.short}</span><span class="hl-portrait-note">${media.studios[t.id]?'Preview ready':'Preview soon'}</span>${state.tower===t.id?`<span class="hl-check">${icon('check')}</span>`:''}</button>`).join('')}</div></section></div>${state.screen==='lab'?dialogHTML():''}`;
 }
 function dialogHTML(){
  if(!state.overlay)return '';
  let c='';
  if(state.overlay==='settings')c=`<span class="hl-kicker">Comfort + feedback</span><h2>Settings</h2><label class="hl-setting-row"><span>Campus ambience</span><input type="checkbox" data-setting="ambience" ${state.ambience?'checked':''}></label><label class="hl-setting-row"><span>Interface sounds</span><input type="checkbox" data-setting="sound" ${state.sound?'checked':''}></label><label class="hl-setting-row"><span>Reduced motion</span><input type="checkbox" data-setting="reduced" ${state.reduced?'checked':''}></label><div class="hl-dialog-actions">${btn('Done','close','hl-primary')}</div>`;
  if(state.overlay==='continue')c=`<span class="hl-kicker">Level 1 · Continue run</span><h2>One small feature.<br>A little more progress.</h2><p>Wave 4 · Planning<br>Product health: 80 / 100<br>Available Compute: 125</p><div class="hl-next-wave">${icon('bug')} Bugs + Missing Details incoming</div><div class="hl-dialog-actions">${btn(icon('play')+' Enter planning','planning','hl-primary')}${btn('Back to Hub','close','hl-quiet')}</div>`;
  if(state.overlay==='levels')c=`<span class="hl-kicker">Choose a level</span><h2>Your next build.</h2><div class="hl-level">${icon('flag')}<span>Just one small feature<small>Level 1 · Saved at wave 4</small></span></div><div class="hl-level">${icon('lock-keyhole')}<span>More stories ahead<small>Future levels are still being designed.</small></span></div><div class="hl-dialog-actions">${btn(icon('play')+' Continue Level 1','continue','hl-primary')}${btn('Back to Hub','close','hl-quiet')}</div>`;
  if(state.overlay==='product')c=`<span class="hl-kicker">Your Product</span><h2>Something worth<br>protecting.</h2><p>Completed Work grows your Product after successful levels. Each new corner is a sign of progress.</p><div class="hl-dialog-actions">${btn('Back to Hub','close','hl-primary')}</div>`;
  return `<div class="hl-dialog-backdrop"><div class="hl-dialog hl-panel" role="dialog" aria-modal="true" aria-label="${state.overlay}">${c}</div></div>`;
 }
 function render(focus=false){
  hub.hidden=state.screen!=='hub';lab.hidden=state.screen!=='lab';
  root.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===state.screen)));
  hub.querySelector('.hl-home-content').innerHTML=homeHTML();lab.querySelector('.hl-lab-content').innerHTML=labHTML();
  if(state.screen==='lab'&&state.overlay)lab.querySelector('.hl-lab-content>div').inert=true;
  palette(hub,styling.hub);palette(lab,styling.lab);
  if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
  if(focus)queueMicrotask(()=>root.querySelector(state.overlay?(state.screen==='hub'?'#field-kit-hub .hl-dialog button':'#field-kit-inspection .hl-dialog button'):(state.screen==='lab'?'#field-kit-inspection [data-action="hub"]':'#field-kit-hub [data-action="inspect"]'))?.focus({preventScroll:true}));
 }
 root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!root.contains(b))return;
  if(b.dataset.screen){state.screen=b.dataset.screen;state.overlay=null;state.notice=null;render();save();return;}
  if(b.dataset.tower){state.tower=b.dataset.tower;state.view='front';render();lab.querySelector(`[data-tower="${state.tower}"]`)?.focus({preventScroll:true});save();return;}
  if(b.dataset.modelView){state.view=b.dataset.modelView;render();lab.querySelector(`[data-model-view="${state.view}"]`)?.focus({preventScroll:true});save();return;}
  if(b.dataset.camera){state.camera=b.dataset.camera;render();hub.querySelector(`[data-camera="${state.camera}"]`)?.focus({preventScroll:true});save();return;}
  const a=b.dataset.action;
  if(a==='inspect'){state.screen='lab';state.overlay=null;state.notice=null;}
  if(a==='hub'){state.screen='hub';state.overlay=null;state.notice=null;}
  if(['settings','continue','levels','product'].includes(a))state.overlay=a;
  if(a==='close')state.overlay=null;
  if(a==='ambience'){state.ambience=!state.ambience;state.notice=state.ambience?'Campus ambience on':'Campus ambience paused';}
  if(a==='sound'){state.sound=!state.sound;state.notice=state.sound?'Interface sounds on':'Interface sounds muted';}
  if(a==='planning'){state.overlay=null;state.notice='Wave 4 · Ready for planning';}
  render(true);save();
 });
 root.addEventListener('change',e=>{const setting=e.target.dataset.setting;if(setting){state[setting]=e.target.checked;save();}});
 root.addEventListener('keydown',e=>{
  if(e.key==='Escape'){e.preventDefault();if(state.overlay)state.overlay=null;else state.screen='hub';render(true);save();return;}
  if(e.key==='Tab'&&state.overlay){const screen=state.screen==='hub'?hub:lab;const focusable=[...screen.querySelectorAll('.hl-dialog button,.hl-dialog input')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  if(e.target.dataset.tower&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const index=towers.findIndex(t=>t.id===state.tower);state.tower=towers[(index+(['ArrowLeft','ArrowUp'].includes(e.key)?6:1))%7].id;state.view='front';render();lab.querySelector(`[data-tower="${state.tower}"]`)?.focus({preventScroll:true});save();}
 });
 document.addEventListener('keydown',e=>{
  if(document.activeElement!==document.body&&document.activeElement!==document.documentElement)return;
  if(state.overlay)return;
  if(state.screen==='hub'&&['1','2','3','Enter'].includes(e.key)){e.preventDefault();root.querySelector('#field-kit-hub [data-action="'+({'1':'inspect','2':'product','3':'levels',Enter:'continue'}[e.key])+'"]')?.click();}
 });
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent?.hubLab;if(saved){Object.assign(state,saved);render();}});
 render();
 if(globalThis.Tweak){for(const [id,el] of [['hub',hub],['lab',lab]]){const t=new Tweak({container:el,onChange:()=>palette(el,styling[id])});t.addSelect(styling[id],'tone',{label:'Surface palette',options:['Graphite','Campus slate']});t.addColorPicker(styling[id],'accent',{label:'Selection accent',reference:'--hl-accent'});t.addSlider(styling[id],'radius',{label:'Panel corners',min:4,max:10,unit:'px',reference:'--hl-radius'});}}
})();
</script>
