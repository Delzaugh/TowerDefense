<style>
#tower-command-bar{--cmd-bg:light-dark(#f6f8fa,#0d1117);--cmd-panel:light-dark(#fff,#151b23);--cmd-raised:light-dark(#f0f3f6,#212830);--cmd-ink:light-dark(#1f2328,#f0f6fc);--cmd-muted:light-dark(#59636e,#b1bac4);--cmd-edge:light-dark(#d1d9e0,#3d444d);--cmd-accent:light-dark(#0969da,#58a6ff);--cmd-primary:light-dark(#1f883d,#238636);--cmd-on-primary:#fff;--cmd-shade:light-dark(#1f232855,#010409aa);--cmd-field:light-dark(#dbe4e9,#273a46);--cmd-grid:light-dark(#c1cdd4,#3a505e);--cmd-model:light-dark(#8aa6b3,#5c8297);font:14px/1.5 'Mona Sans','Segoe UI',system-ui,sans-serif;color:var(--cmd-ink);color-scheme:light dark;width:100%;background:var(--cmd-bg);position:relative}
#tower-command-bar *{box-sizing:border-box}
#tower-command-bar [hidden]{display:none!important}
#tower-command-bar button,#tower-command-bar select,#tower-command-bar input{font:inherit}
#tower-command-bar .cmd-topbar{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);align-items:center;gap:12px;padding:12px 20px;min-height:70px;background:var(--cmd-panel);border-bottom:1px solid var(--cmd-edge)}
#tower-command-bar .cmd-leading,#tower-command-bar .cmd-trailing{display:flex;align-items:center;gap:8px;min-width:0}
#tower-command-bar .cmd-trailing{justify-content:flex-end}
#tower-command-bar .cmd-brand{font-weight:750;letter-spacing:.12em;font-size:18px;white-space:nowrap}
#tower-command-bar .cmd-context{display:flex;flex-direction:column;align-items:center;min-width:0;text-align:center;gap:1px}
#tower-command-bar .cmd-context strong{font-weight:650;font-size:13px;overflow-wrap:anywhere}
#tower-command-bar .cmd-context span{font-size:11px;color:var(--cmd-muted)}
#tower-command-bar .cmd-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 13px;border:1px solid var(--cmd-edge);border-radius:6px;background:var(--cmd-raised);color:var(--cmd-ink);font-weight:600;font-size:12px}
#tower-command-bar .cmd-button:hover{background:color-mix(in srgb,var(--cmd-raised),var(--cmd-ink) 7%)}
#tower-command-bar .cmd-button:active{transform:translateY(1px)}
#tower-command-bar .cmd-button.cmd-primary{background:var(--cmd-primary);color:var(--cmd-on-primary);border-color:var(--cmd-primary)}
#tower-command-bar .cmd-button.cmd-primary:hover{background:color-mix(in srgb,var(--cmd-primary),var(--cmd-on-primary) 7%)}
#tower-command-bar .cmd-icon{width:42px;flex:none;padding:9px}
#tower-command-bar .cmd-back{background:transparent;border-color:transparent;padding-left:5px}
#tower-command-bar .cmd-escape{font-size:11px;font-weight:400;color:var(--cmd-muted);padding:1px 4px;border:1px solid var(--cmd-edge);border-radius:3px}
#tower-command-bar .lucide{width:17px;height:17px;flex:none;stroke-width:1.8}
#tower-command-bar .cmd-field{position:relative;min-height:610px;overflow:hidden;background:radial-gradient(ellipse at 55% 40%,color-mix(in srgb,var(--cmd-field),var(--cmd-model) 12%),var(--cmd-field))}
#tower-command-bar .cmd-campus{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 42%}
#tower-command-bar .cmd-grid{position:absolute;inset:70px -10% -30%;background-image:linear-gradient(var(--cmd-grid) 1px,transparent 1px),linear-gradient(90deg,var(--cmd-grid) 1px,transparent 1px);background-size:72px 72px;transform:perspective(480px) rotateX(42deg);opacity:.5;pointer-events:none}
#tower-command-bar .cmd-lab{position:absolute;left:43%;top:20%;width:200px;height:170px;background:var(--cmd-model);border:8px solid color-mix(in srgb,var(--cmd-model),var(--cmd-ink) 15%);border-radius:6px;transform:skewY(-8deg);box-shadow:24px 28px 0 color-mix(in srgb,var(--cmd-field),var(--cmd-ink) 12%)}
#tower-command-bar .cmd-lab:before{content:'';position:absolute;inset:25px 20px 42px;background:repeating-linear-gradient(90deg,var(--cmd-field) 0 24px,transparent 24px 33px)}
#tower-command-bar .cmd-lab:after{content:'';position:absolute;bottom:0;left:75px;width:38px;height:45px;background:var(--cmd-field)}
#tower-command-bar .cmd-portrait{position:absolute;left:calc(50% - 135px);top:12%;width:270px;height:270px;object-fit:contain;filter:drop-shadow(0 16px 12px var(--cmd-shade))}
#tower-command-bar .cmd-scene-caption{position:absolute;top:20px;left:24px;color:var(--cmd-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#tower-command-bar .cmd-panel{background:var(--cmd-panel);border:1px solid var(--cmd-edge);border-radius:8px;box-shadow:0 6px 24px var(--cmd-shade)}
#tower-command-bar .cmd-entry{position:absolute;bottom:24px;left:24px;width:min(292px,calc(100% - 48px));padding:18px}
#tower-command-bar .cmd-entry h2{margin:6px 0 10px;font-size:25px;line-height:1.2;font-weight:750}
#tower-command-bar .cmd-entry p{margin:0 0 16px;color:var(--cmd-muted);font-size:12px}
#tower-command-bar .cmd-entry .cmd-button{width:100%;justify-content:space-between}
#tower-command-bar .cmd-kicker{color:var(--cmd-muted);font-size:11px}
#tower-command-bar .cmd-preview{position:absolute;left:24px;top:22px;right:24px;display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center;color:var(--cmd-ink)}
#tower-command-bar .cmd-preview span{display:inline-flex;align-items:center;gap:7px;background:var(--cmd-panel);border:1px solid var(--cmd-edge);border-radius:6px;padding:7px 10px;font-size:12px}
#tower-command-bar .cmd-route{position:absolute;left:12%;right:12%;top:25%;height:160px;border:40px solid var(--cmd-grid);border-left:0;border-bottom:0;transform:skewY(-12deg);opacity:.8}
#tower-command-bar .cmd-scrim{position:absolute;inset:0;background:var(--cmd-shade);z-index:4}
#tower-command-bar .cmd-menu{position:relative;z-index:5;width:min(356px,calc(100% - 32px));margin:26px auto 0;padding:20px;color:var(--cmd-ink)}
#tower-command-bar .cmd-menu-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
#tower-command-bar .cmd-menu h2{margin:5px 0 0;font-size:25px;line-height:1.2;font-weight:750}
#tower-command-bar .cmd-menu .cmd-primary{width:100%;justify-content:space-between;margin-bottom:15px}
#tower-command-bar .cmd-setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--cmd-edge);font-size:13px}
#tower-command-bar .cmd-setting select{min-height:42px;max-width:150px;padding:8px;border:1px solid var(--cmd-edge);border-radius:6px;background:var(--cmd-raised);color:var(--cmd-ink)}
#tower-command-bar .cmd-setting input{width:20px;height:20px;accent-color:var(--cmd-accent)}
#tower-command-bar .cmd-menu-exit{width:100%;margin-top:16px}
#tower-command-bar .cmd-menu-footer{margin:14px 0 0;color:var(--cmd-muted);font-size:11px;display:flex;align-items:center;justify-content:space-between}
#tower-command-bar[data-menu='true'] .cmd-field{min-height:610px}
#tower-command-bar .cmd-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:600px){#tower-command-bar .cmd-topbar{grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 12px}#tower-command-bar .cmd-context{grid-column:1/-1;grid-row:2;flex-direction:row;justify-content:center;gap:8px}#tower-command-bar .cmd-context strong{font-size:12px}#tower-command-bar .cmd-brand{font-size:16px}#tower-command-bar .cmd-back-label{display:none}#tower-command-bar .cmd-back{width:42px;padding:9px}#tower-command-bar .cmd-back .cmd-escape{display:none}#tower-command-bar .cmd-field{min-height:610px}#tower-command-bar .cmd-lab{left:32%;width:165px;height:145px}#tower-command-bar .cmd-entry{left:16px;bottom:16px;width:calc(100% - 32px)}#tower-command-bar .cmd-scene-caption{left:16px}#tower-command-bar .cmd-menu{padding:18px;margin-top:18px}#tower-command-bar .cmd-preview{left:16px;right:16px;gap:6px}#tower-command-bar .cmd-preview span{font-size:11px;padding:6px 8px}}
@media(pointer:coarse){#tower-command-bar .cmd-button,#tower-command-bar .cmd-setting select{min-height:44px}#tower-command-bar .cmd-icon,#tower-command-bar .cmd-back{width:44px}#tower-command-bar .cmd-setting select{font-size:16px}}
@media(prefers-reduced-motion:reduce){#tower-command-bar .cmd-button:active{transform:none}}
</style>

    <div class="cmd-route" aria-hidden="true" data-mission-only hidden></div>
    <span class="cmd-scene-caption" data-inspection-only hidden data-scene>Developer · workbench study</span>
    <div class="cmd-preview" data-mission-only hidden><span>Future mission · illustrative</span><span><i data-lucide="heart" aria-hidden="true"></i>Product 100</span><span><i data-lucide="cpu" aria-hidden="true"></i>Compute 240</span></div>
    <section class="cmd-panel cmd-entry" data-hub-only>
      <span class="cmd-kicker">COPILOT LAB</span><h2>Meet your Copilots.</h2><p>Explore Personas and their capabilities.</p>
      <button class="cmd-button cmd-primary cursor-interaction" type="button" data-inspect>Inspect Towers<i data-lucide="arrow-up-right" aria-hidden="true"></i></button>
    </section>
    <section class="cmd-panel cmd-entry" data-inspection-only hidden><span class="cmd-kicker">PERSONA</span><h2>Developer</h2><p>Build, defend and adapt.</p></section>
    <div class="cmd-scrim" data-scrim hidden></div>
    <section class="cmd-panel cmd-menu" role="dialog" aria-modal="true" aria-labelledby="cmd-menu-title" hidden>
      <div class="cmd-menu-head"><div><span class="cmd-kicker" data-menu-context>Copilot Hub</span><h2 id="cmd-menu-title">Game menu</h2></div><button class="cmd-button cmd-icon cursor-interaction" type="button" data-close aria-label="Close game menu"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <button class="cmd-button cmd-primary cursor-interaction" type="button" data-resume><span data-resume-label>Return to campus</span><i data-lucide="play" aria-hidden="true"></i></button>
      <label class="cmd-setting"><span>Appearance</span><select class="cursor-interaction" aria-label="Appearance" data-theme><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <label class="cmd-setting"><span>Campus ambience</span><input class="cursor-interaction" data-ambience type="checkbox" checked></label>
      <label class="cmd-setting"><span>Reduce motion</span><input class="cursor-interaction" data-motion type="checkbox"></label>
      <button class="cmd-button cmd-menu-exit cursor-interaction" type="button" data-exit hidden><i data-lucide="house" aria-hidden="true"></i>Return to Hub</button>
      <div class="cmd-menu-footer"><span data-menu-status>Campus ambience on</span><span class="cmd-escape" aria-hidden="true">Esc</span></div>

  </main>
</div>
<script>
(()=>{
  const root=document.getElementById('tower-command-bar');
  const state={context:'hub',theme:'light',audio:true,ambience:true,reducedMotion:false};
  const contexts={hub:{location:'Copilot Hub',detail:'Campus',scene:'Copilot Lab · campus study',resume:'Return to campus'},inspection:{location:'Copilot Lab',detail:'Tower inspection',scene:'Developer · workbench study',resume:'Return to inspection'},mission:{location:'Garden Switchback',detail:'Wave 3 / 8 · concept',scene:'',resume:'Resume mission'}};
  const find=selector=>root.querySelector(selector);
  let open=false;
  function render(){
    const context=contexts[state.context]||contexts.hub;
    root.dataset.context=state.context;
    root.style.colorScheme=state.theme==='system'?'light dark':state.theme;
    find('[data-theme]').value=state.theme;
    find('[data-ambience]').checked=state.ambience;
    find('[data-motion]').checked=state.reducedMotion;
    find('[data-location]').textContent=context.location;
    find('[data-detail]').textContent=context.detail;
    find('[data-scene]').textContent=context.scene;
    find('[data-menu-context]').textContent=context.location;
    find('[data-resume-label]').textContent=context.resume;
    find('[data-menu-status]').textContent=state.reducedMotion?'Motion reduced':`Campus ambience ${state.ambience?'on':'off'}`;
    root.querySelectorAll('[data-hub-only]').forEach(element=>element.hidden=state.context!=='hub');
    root.querySelectorAll('[data-inspection-only]').forEach(element=>element.hidden=state.context!=='inspection');
    root.querySelectorAll('[data-mission-only]').forEach(element=>element.hidden=state.context!=='mission');
    find('[data-scene-backdrop]').hidden=state.context==='inspection';
    find('[data-back]').hidden=state.context==='hub';
    find('[data-exit]').hidden=state.context==='hub';
    find('[data-audio]').setAttribute('aria-label',state.audio?'Mute audio':'Unmute audio');
    find('[data-audio]').setAttribute('aria-pressed',String(!state.audio));
    find('[data-audio-on]').hidden=!state.audio;
    find('[data-audio-off]').hidden=state.audio;
  }
  function save(){
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{context:state.context,appearance:state.theme},privateContent:{audio:state.audio,ambience:state.ambience,reducedMotion:state.reducedMotion}}).catch(()=>{});
  }
  function applySaved(snapshot){
    const model=snapshot?.modelContent||{},details=snapshot?.privateContent||{};
    if(contexts[model.context])state.context=model.context;
    if(['light','dark','system'].includes(model.appearance))state.theme=model.appearance;
    ['audio','ambience','reducedMotion'].forEach(key=>{if(typeof details[key]==='boolean')state[key]=details[key]});
    render();
  }
  function menu(value){
    open=value;root.dataset.menu=String(open);
    find('.cmd-menu').hidden=!open;find('[data-scrim]').hidden=!open;
    find('[data-menu-open]').setAttribute('aria-expanded',String(open));
    find('.cmd-topbar').inert=open;
    Array.from(find('.cmd-field').children).forEach(element=>{if(!element.matches('.cmd-menu,[data-scrim],[data-status]'))element.inert=open});
    if(open)find('[data-resume]').focus();
    else find('[data-menu-open]').focus();
    find('[data-status]').textContent=open?(state.context==='mission'?'Mission preview paused.':'Game menu open.'):'Returned to scene.';
  }
  find('[data-menu-open]').addEventListener('click',()=>menu(true));
  find('[data-close]').addEventListener('click',()=>menu(false));
  find('[data-resume]').addEventListener('click',()=>menu(false));
  find('[data-scrim]').addEventListener('click',()=>menu(false));
  find('[data-inspect]').addEventListener('click',()=>{state.context='inspection';render();save();find('[data-back]').focus()});
  function hub(){state.context='hub';menu(false);render();save();find('[data-inspect]').focus()}
  find('[data-back]').addEventListener('click',hub);
  find('[data-exit]').addEventListener('click',hub);
  find('[data-audio]').addEventListener('click',()=>{state.audio=!state.audio;render();save()});
  find('[data-theme]').addEventListener('change',event=>{state.theme=event.target.value;render();save()});
  find('[data-ambience]').addEventListener('change',event=>{state.ambience=event.target.checked;render();save()});
  find('[data-motion]').addEventListener('change',event=>{state.reducedMotion=event.target.checked;render();save()});
  root.addEventListener('keydown',event=>{
    if(event.key==='Escape'){event.preventDefault();if(open)menu(false);else if(state.context!=='hub')hub();else menu(true)}
    if(open&&event.key==='Tab'){
      const controls=Array.from(find('.cmd-menu').querySelectorAll('button,select,input')).filter(element=>!element.hidden);
      const first=controls[0],last=controls[controls.length-1];
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
    }
  });
  applySaved(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState)applySaved(event.detail.globals.widgetState)});
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:()=>{render();save()}});
    tweak.addSelect(state,'context',{label:'Game context',options:[{label:'Hub',value:'hub'},{label:'Tower inspection',value:'inspection'},{label:'Future mission',value:'mission'}]});
    tweak.addSelect(state,'theme',{label:'Appearance',options:[{label:'System',value:'system'},{label:'Light',value:'light'},{label:'Dark',value:'dark'}]});
  }
})();
</script>
